apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  namespace: default
  labels:
    app: demo
spec:
  containers:
  - name: demo
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600000"]
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/demo-secret
      readOnly: true
  volumes:
  - name: secret-vol
    secret:
      secretName: demo-secret
